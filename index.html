<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Simple Memory Game</title>

        <link rel="stylesheet" href="./css/modern-normalize.css">
        <link rel="stylesheet" href="./css/styles.css">
    </head>

    <body>
        <header>
            <h1>Simple Memory Game</h1>
        </header>

        <main>

            <section class="cards">
                <div class="card" id="cardOne">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardTwo">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardThree">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardFour">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardFive">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardSix">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardSeven">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardEight">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardNine">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
                <div class="card" id="cardTen">
                    <img src="./images/windows-solitaire-palm_tree-card_back.jpg"
                        alt="Windows Solitaire Palm Tree Card Back">
                </div>
            </section>

            <section class="counters">
                <div>
                    <span>Pick Count:</span>
                    <span class="pickCount">0</span>
                </div>
                <div>
                    <span>Pick Rate:</span>
                    <span class="pickRate">0</span>
                </div>
                <div>
                    <button class="playAgain" disabled>Play Again</button>
                    <button class="resetGame">Reset Game</button>
                </div>
            </section>
        </main>

        <footer>
            <small>Made by: Niles</small>
        </footer>

        <script type="text/javascript" src="./js/main.js"></script>
    </body>

</html>
