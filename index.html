<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Welcome</title>
</head>

<body>
    <h1>Match Em N' Bag Em</h1>
    <h2>Welcome to your new favorite game!</h2>
    <select name="player-number" id="player-number">
        <option value="1-player" id="1-player">Select the number of players</option>
        <option value="2-player" id="2-player">2 Players</option>
        <option value="3-player" id="3-player">3 Players</option>
    </select>
    <input type="text" id="player-1" placeholder="Player Name">
    <input type="text" id="player-2" class="hidden" placeholder="Player Name">
    <input type="text" id="player-3" class="hidden" placeholder="Player Name">
    <button>Start Game</button>
    <h4></h4>
    <div id="container" class="hidden1">
        <div id="progress-bar"></div>
        <p>Loading...</p>
    </div>
    <script type="text/javascript" src="js/main.js"></script>
</body>

</html>
