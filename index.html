<html lang="en">

<head>
	<meta charset="UTF-8">

	<link rel="stylesheet" href="css/style.css">
</head>

<body>
		<img src="img/ccs.png" class="sakura" alt="Card Captor Sakura">

		<!-- <h1>Card Captor Sakura Matching Game</h1> -->

		<section id="gameBox">
			
			<div class="card" data-digi="hope">	
				<img class="back" src="img/sakura.webp">

			</div>

			<div class="card" data-digi="hope">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/hope.jpg">
			</div>

			<div class="card" data-digi="nothing">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/nothing.webp">
			</div>

			<div class="card" data-digi="nothing">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/nothing.webp">
			</div>

			<div class="card" data-digi="loop">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/loop.webp">
			</div>

			<div class="card" data-digi="loop">
				<img class="back" src="img/sakura.webp">

			</div>

			<div class="card" data-digi="float">
				<img class="back" src="img/sakura.webp">

			</div>

			<div class="card" data-digi="float">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/float.webp">
			</div>

			<div class="card" data-digi="sword">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/sword.webp">
			</div>

			<div class="card" data-digi="sword">
				<img class="back" src="img/sakura.webp">
				<img class="front" src="img/sword.webp">
			</div>

		</section>

		<button id="resetButton">クリア</button>

		<script type="text/javascript" src="js/main.js"></script>
