		<title>Memory Card Game</title>

	<body>
		<h1> Card Game </h1>

		<button id="start"> Start Game </button>

		<div id="cards">
			<!-- cards have to be more than 10, match case 2 at a time -->
			<div class="card">🂭</div>
			<div class="card">🂥</div>
			<div class="card">🂠</div>
			<div class="card">🂥</div>
			<div class="card">🂠</div>

			<div class="card">🂠</div>
			<div class="card">🂠</div>
			<div class="card">🂪</div>
			<div class="card">🂠</div>
			<div class="card">🂭</div>
		</div>

		<div id="score">Score: <span id="initialScore">0</span></div>
		<div id="winMessage"></div>
		<script src="js/main.js"></script>
	</body>
