<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Card Game</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
    <h1> Coffee Run Match Game </h1>
    <p> Put your memory to the Test! Flip two cards a time and try to find the matching pairs. Match all 5 cards to win. </p>
    <div class = "container-card row-1">
        <section class="card" id="card-1">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/coffee-.svg" alt="take-out-coffee-cup">
            </div>
        </section>
        <section class="card" id="card-2">
            <div class ="front"></div>
            <div class ="back ">
                <img src="img/coffee.svg" alt="french-press">
            </div>
        </section>
        <section class="card" id="card-3">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/croissant.svg" alt="croissant">
            </div>
        </section>
        <section class="card" id="card-4">
            <div class ="front "></div>
            <div class ="back ">
                <img src="img/doughnut.svg" alt="doughnut">
            </div>
        </section>
        <section class="card" id="card-5">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/muffin.svg" alt="muffin">
            </div>
        </section>
    </div>
    <div class = "container-card row-2">
        <section class="card" id="card-6">
            <div class ="front"></div>
            <div class = "back">
                <img src="img/croissant.svg" alt="croissant">
            </div>
        </section>
        <section class="card" id="card-7">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/muffin.svg" alt="muffin">
            </div>
        </section>
        <section class="card" id="card-8">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/coffee.svg" alt="french-press">
            </div>
        </section>
        <section class="card" id="card-9"> 
            <div class ="front">
            </div>
            <div class ="back">
                <img src="img/coffee-.svg" alt="take-out-coffee-cup">
            </div>
        </section>
        <section class="card" id="card-10">
            <div class ="front"></div>
            <div class ="back">
                <img src="img/doughnut.svg" alt="doughnut">
            </div>
        </section>
</main>

    <script src="js/main.js"></script>
</body>
</html>
