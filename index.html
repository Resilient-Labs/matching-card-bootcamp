<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Finger+Paint&display=swap" rel="stylesheet">
  <title>Matching Card</title>
</head>
<body>
  <div class="header-container">
    <h1>Test Your Memory</h1>
    <div class="timer-container">
      <span class="timer-label">Time:</span>
      <span id="timer" class="timer">00:00</span>
    </div>
  </div>
  <section class="memory-game">
    <section class="memory-card" data-framework="sheep">
      <img class="front-face" src="img/Sheep.png" alt="sheep" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
    <section class="memory-card" data-framework="sheep">
      <img class="front-face" src="img/Sheep.png" alt="sheep" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>

    <section class="memory-card" data-framework="fox">
      <img class="front-face" src="img/fox.png" alt="fox" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
    <section class="memory-card" data-framework="fox">
      <img class="front-face" src="img/fox.png" alt="fox" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>

    <section class="memory-card" data-framework="otter">
      <img class="front-face" src="img/otter.png" alt="otter" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
    <section class="memory-card" data-framework="otter">
      <img class="front-face" src="img/otter.png" alt="otter" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>

    <section class="memory-card" data-framework="whale">
      <img class="front-face" src="img/blue whale.png" alt="whale" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
    <section class="memory-card" data-framework="whale">
      <img class="front-face" src="img/blue whale.png" alt="whale" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>

    <section class="memory-card" data-framework="capybara">
      <img class="front-face" src="img/capybara.png" alt="capybara" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
    <section class="memory-card" data-framework="capybara">
      <img class="front-face" src="img/capybara.png" alt="capybara" />
      <img class="back-face" src="img/back.png" alt="panda" />
    </section>
  </section>
  
  <!-- Modal Dialog -->
  <div id="winModal" class="modal">
    <div class="modal-content">
      <p class="modal-message">You have a good memory</p>
      <button id="playAgainBtn" class="modal-btn">Want to try again?</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
