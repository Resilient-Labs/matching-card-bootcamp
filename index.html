<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Matching-Game</title>
</head>
<body>
    <h1>BRATZ MATCH</h1>

    <p>Find all of the matching Bratz Dolls!</p>

    <div>
        <section class="cards" index="0"></section>
        <section class="cards" index="1"></section>
        <section class="cards" index="2"></section>
        <section class="cards" index="3"></section>
    </div>
    <div>
        <section class="cards" index="4"></section>
        <section class="cards" index="5"></section>
        <section class="cards" index="6"></section>
        <section class="cards" index="7"></section>
    </div>


    <h2 id="text"></h2>
    

    <button id="reset">Play Again</button>

</body>
</html>
