<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="Bread Matching Game" content="Bread matching game">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Bread Matching Game </title>
		<!-- external CSS link -->
		 <link rel="stylesheet" href="css/normalize.css">
		 <link rel="stylesheet" href="css/style.css">
	</head>

<body>
		<header>
		<h1>Bread Matching Game</h1>

		<p class="win-message"> Congrats! You Won the Bread Matching Game!</p>
	</section>
	<script type="text/javascript" src="js/main.js"></script>
</body>
