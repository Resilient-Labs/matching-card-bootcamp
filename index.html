<!DOCTYPE html>
<html lang="en">
	<head>
  	<meta charset="utf-8">
  	<meta name="description" content="A New York City themed matching card game">
  	<meta name="keywords" content="matching card game, memory game, JavaScript">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		
		<title>NYC Match</title>

		<!-- external CSS link -->
		<link rel="stylesheet" href="css/normalize.css">
		<link rel="stylesheet" href="css/style.css">
	</head>
	<body>

<header>
    <nav>
        <h1>NYC MATCH</h1>
        <p>Find all five pairs before the city gets the best of you.</p>
    </nav>
</header>

<main class="container">

    <section class="table">

        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
        <section class="flip"><img src="" class="card hidden" alt=""></section>
       
    </section>

<section class="game-info">

    <h2 class="winner">Wins:<span>0</span></h2>

    <!-- <h2 class="loser'">Misses:<span>0</span></h2> -->
    <h2 class="misses">Misses:<span>0</span></h2>
    
    <h3 class="message"></h3>

    <button type="button" class="redo">START</button>

</section>

</main>

<footer>
    <p>Made in New York with love.</p>
</footer>

		<script type="text/javascript" src="js/main.js"></script>
	</body>
</html>
